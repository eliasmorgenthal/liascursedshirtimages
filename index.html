<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= HOME ================= -->
<div id="home" class="screen show">

  <h1 class="title">Choose a Theme</h1>

  <div class="themes">

    <button onclick="openGallery('PlaneAccident')">Plane Accident</button>
    <button onclick="openGallery('Cars')">Cars</button>
    <button onclick="openGallery('Race')">Race</button>
    <button onclick="openGallery('ICE')">ICE</button>
    <button onclick="openGallery('Ped')">Ped</button>
    <button onclick="openGallery('Down')">Down</button>
    <button onclick="openGallery('More')">More</button>

  </div>

</div>

<!-- ================= GALLERY ================= -->
<div id="gallery" class="screen hidden">

  <div class="topbar">
    <button onclick="goHome()">← Back</button>
  </div>

  <div class="viewer">

    <div class="arrow left" onclick="prevImage()">‹</div>

    <img id="slideshow">

    <div class="arrow right" onclick="nextImage()">›</div>

  </div>

</div>

<script src="morestyle.js"></script>
</body>
</html>
