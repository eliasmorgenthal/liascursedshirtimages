<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Slideshow</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Image Gallery Slideshow</h1>

    <!-- SLIDESHOW -->
    <img id="slideshow" src="" alt="Gallery Image">

    <!-- CONTROLS -->
    <div class="controls">
      <button onclick="prevImage()">⟵ Previous</button>
      <button onclick="nextImage()">Next ⟶</button>
    </div>

    <!-- GALLERY SELECT -->
    <div class="gallery-buttons">
      <button onclick="changeGallery('PlaneAccident')">PlaneAccident</button>
		<button onclick="changeGallery('Cars')">Cars</button>
		<button onclick="changeGallery('Race')">Race</button>
		<button onclick="changeGallery('Ped')">Ped</button>
		<button onclick="changeGallery('ICE')">ICE</button>
		<button onclick="changeGallery('Down')">Down</button>
		<button onclick="changeGallery('More')">More</button>
    </div>

  </div>

  <script src="morestyle.js"></script>

</body>
</html>
